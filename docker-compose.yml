version: "3.8"

services:
  xeptopcore-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xeptopcore-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=3
      - HISTORY_FILE=/data/history.json
    restart: unless-stopped
